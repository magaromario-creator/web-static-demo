apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: web-httpd-demo-git-
  annotations:
    # Repository PaC (deve combaciare con il CR Repository)
    pipelinesascode.tekton.dev/repository: web-httpd-demo-git

    # Eventi da intercettare
    pipelinesascode.tekton.dev/on-event: push
    pipelinesascode.tekton.dev/on-target-branch: main

    # 🔑 FONDAMENTALE SU CRC
    pipelinesascode.tekton.dev/polling: "true"
    pipelinesascode.tekton.dev/polling-interval: "1m"

spec:
  pipelineSpec:
    workspaces:
      - name: source

    tasks:
      - name: build-and-push-image
        workspaces:
          - name: source
            workspace: source

        taskSpec:
          workspaces:
            - name: source

          steps:
            - name: build-and-push
              image: quay.io/buildah/stable:v1.34
              securityContext:
                privileged: true
              workingDir: $(workspaces.source.path)
              script: |
                echo "🔧 Building image..."
                buildah bud \
                  -t image-registry.openshift-image-registry.svc:5000/webtest/web-httpd-demo-git:latest .

                echo "📦 Pushing image..."
                buildah push \
                  image-registry.openshift-image-registry.svc:5000/webtest/web-httpd-demo-git:latest

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
